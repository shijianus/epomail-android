plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

// Release signing comes from android/key.properties (git-ignored) or the
// EPO_KEYSTORE_* environment variables. Neither is ever committed.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def signingValue = { String prop, String env ->
    keystoreProperties.getProperty(prop) ?: System.getenv(env)
}
def releaseStoreFile = signingValue('storeFile', 'EPO_KEYSTORE_FILE')
def hasReleaseKeystore = releaseStoreFile != null && !releaseStoreFile.isEmpty()
def requireReleaseKeystore = System.getenv('EPO_REQUIRE_RELEASE_SIGNING') == 'true'
if (requireReleaseKeystore && !hasReleaseKeystore) {
    throw new GradleException(
        'Release signing is required but no keystore is configured. ' +
        'See "Release signing" in README.md.')
}

android {
    namespace "com.epocanvas.mail"
    compileSdk 35
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.epocanvas.mail"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'EPO_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'EPO_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'EPO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Without a keystore the APK is debug-signed: fine for a local
            // smoke test, never for distribution (CI refuses to publish it).
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "androidx.multidex:multidex:2.0.1"
}
